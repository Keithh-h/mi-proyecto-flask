<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página con Flask</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        .tarjeta {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 500px;
        }
        h1 { color: #2b6cb0; }
        p { font-size: 18px; }
        .badge {
            background-color: #48bb78;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="tarjeta">
        <h1>¡Hola Mundo! 🚀</h1>
        <p>Esta página web está siendo cocinada con <strong>Flask</strong> en el Backend.</p>
        <p>Guardada en <strong>GitHub</strong> y servida al universo gracias a <strong>Render</strong>.</p>
        <hr>
        <p>Estatus del proyecto: <span class="badge">¡En Línea! ✨</span></p>
    </div>

</body>
</html>
